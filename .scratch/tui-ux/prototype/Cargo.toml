# THROWAWAY probe for ticket 03 (collapse hint lines + detail overlay + tool line).
#
# Deliberately its own workspace root so it never joins the fs-agent package
# graph: the repo-root Cargo.toml and src/ are not touched by this crate.
# `ratatui` is the only dependency and it is already vendored in the local
# registry (fs-agent depends on it), so `cargo build --offline` resolves.
[package]
name = "tui-ux-probe"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

[dependencies]
ratatui = "0.30"
