[package]
name = "fs-agent"
version = "0.1.0"
edition = "2021"
description = "A self-hosted coding agent CLI: append-only event stream plus per-agent windows"
license = "MIT"
# 仓库里有**三个** bin（产品本身 + 时间 server + 下面那个测试辅助的假 MCP server），所以
# `cargo run` 得知道不指名时跑哪个 —— 不加这一行它会报「could not determine which binary to
# run」。产品是默认；另两个可以 `cargo run --bin fs-agent-mcp-time` /
# `cargo run --bin fake-mcp-server` 点名跑。
default-run = "fs-agent"

[lib]
name = "fs_agent"
path = "src/lib.rs"

[[bin]]
name = "fs-agent"
path = "src/main.rs"

# 仓库自带的时间 server（`.scratch/time-mcp/spec.md`）：一台 stdio MCP server，只提供一个工具
# `get_current_time`。它**手写**三条协议方法（`server/discover` / `tools/list` / `tools/call`），
# 不开 `rmcp` 的 server 侧 —— 理由写在那份源码的模块注释里。不写盘、不出网、不读配置，所以能过
# 缺省的沙箱；怎么把它挂上见 `docs/mcp.md`。
[[bin]]
name = "fs-agent-mcp-time"
path = "src/bin/mcp_time.rs"

# 集成测试用的假 MCP server（`.scratch/mcp-support/spec.md` §3；票 12）：一个手写的
# newline-delimited JSON-RPC 对端，给 `tests/mcp_stdio.rs` 走真 spawn + 沙箱包装 + 协议帧 +
# 进程组清理那条路。**它不是产品的一部分** —— 只是 Cargo 没有「仅测试的 bin」这个概念，
# 集成测试又想拿 `CARGO_BIN_EXE_fake-mcp-server` 这个稳定的路径。
[[bin]]
name = "fake-mcp-server"
path = "tests/support/fake_mcp_server.rs"

[dependencies]
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
# `fs-agent-mcp-time` 报的那一行里要有时区名（`Asia/Shanghai`）—— `chrono::Local` 只给得出
# 偏移。这个包本来就在 `Cargo.lock` 里（`chrono` 自己的传递依赖），这里只是把它提成直接依赖。
iana-time-zone = "0.1"
futures = "0.3"
# 只走 OpenAI 兼容的传输：不实现各家自己的协议，也不自己解析 SSE。
# `native-tls` 直接链系统的 OpenSSL，不去拉 aws-lc-rs 那套 C 构建。
reqwest = { version = "0.13", default-features = false, features = ["json", "stream", "native-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "net", "time", "process", "io-util"] }
# `bash` 工具的进程树清理：`Command::process_group(0)` 把 shell 放进它自己的进程组，
# 而只有 `killpg` 能终止整个组。
libc = "0.2"
# 交互式渲染器（spec §19）：ratatui 架在 crossterm 后端上，走备用屏幕（alt screen）全屏
# —— 行内视口（inline viewport）那条路已由 ADR 0002 整条删掉，转录因此自己持滚动缓冲。
# `event-stream` 给 crossterm 一个能进 `select!` 的异步键盘源。
ratatui = "0.30"
crossterm = { version = "0.29", features = ["event-stream"] }
# 代码块的语法高亮（spec §4）。tree-sitter 是运行时，下面九个文法是十种语言里除 Rust
# 之外的部分 —— 十个全部硬依赖，没有 feature 门控。每个文法都要编一个 C parser，所以首次
# 构建比纯 Rust 依赖慢；syntect 的 Oniguruma 那条路是刻意不走的。
tree-sitter-highlight = "0.27"
toml = "0.8"
# 只做读侧的符号提取：把官方的 Rust `tags.scm` 过一遍 tree-sitter，得到
# `(file, name, kind)`。这个文法要编一个 C parser，所以首次构建比纯 Rust 依赖慢。
tree-sitter = "0.27"
tree-sitter-rust = "0.24"
tree-sitter-bash = "0.25"
tree-sitter-json = "0.24"
# toml 要的是名字里带 `-ng` 的那个：原版 `tree-sitter-toml` 停在 2022 年、锁 `^0.20`，
# 与这里的 0.27 合不到一起。
tree-sitter-toml-ng = "0.7"
tree-sitter-html = "0.23"
tree-sitter-javascript = "0.25"
tree-sitter-typescript = "0.23"
tree-sitter-php = "0.24"
# sql 同理：`tree-sitter-sql` 停在 2021 年、锁 `^0.19.3`，活着的那份名字与语言对不上。
tree-sitter-sequel = "0.3"
tree-sitter-python = "0.25"
url = "2"
# Markdown 的**解析**（spec §1）：事件流交给它，渲染 —— 列宽、折行、表头、代码块 —— 仍是
# 我们自己的。`default-features = false` 只留下 5 个纯 Rust 包（自己 + bitflags + memchr
# + unicase），**不开** `simd`（那会引入 `unsafe`）。
pulldown-cmark = { version = "0.13", default-features = false }
# `grep` 工具的搜索内核（`.scratch/grep-tool/spec.md` §4）：目录遍历与忽略规则、逐行搜索、
# 正则后端。三个都是 ripgrep 拆出来的 `Unlicense OR MIT` 纯 Rust 库；自带它们换来一条
# 「只读工作区」的搜索，而不是 spawn `rg` —— 后者经沙箱跑起来继承的是「整机可读」，还多出
# 三条运行期依赖（`rg` 在不在 PATH、它自己的配置文件、退出码要自己翻译）。
ignore = "0.4"
grep-searcher = "0.1"
grep-regex = "0.1"
# `grep` 的 `glob` 参数只用它做「搜哪些文件」的匹配（`.scratch/grep-tool/spec.md` §3）。
# 不用 `ignore` 自带的 `OverrideBuilder`：overrides 的优先级高于 `.gitignore`，于是
# `glob` 会变成一条绕过忽略规则的逃生口 —— 而那个参数只该缩小范围，不该放宽规则。
globset = "0.4"
# MCP 的连接层（`.scratch/mcp-support/spec.md` §3）：`rmcp` 是 Rust 的 MCP SDK，只开 client
# 与两种传输（stdio 子进程 + Streamable HTTP），**不开** server。TLS 明确选 `native-tls`
# （`reqwest-native-tls` 这个 feature 是独立的一位）：选 `reqwest` 那位会把它换成 rustls，
# 等于推翻上面 reqwest 那条既有决定。协议只谈 2026-07-28，生命周期固定 `Discover`。
rmcp = { version = "3.5.0", default-features = false, features = [
    "client",
    "transport-child-process",
    "transport-streamable-http-client-reqwest",
    "reqwest-native-tls",
] }
# server 子进程的整组清理：fs-agent 的纪律是 `process_group(0)` + `killpg` 杀整棵树，而 rmcp
# 默认的清理只保证直接子进程被杀。与 rmcp 依赖的是同一个大版本。
process-wrap = { version = "10", features = ["tokio1"] }
# 远端 server 的自定义请求头（`Authorization` 那一类）。
http = "1"

[dev-dependencies]
tempfile = "3"
