[package]
name = "fs-agent"
version = "0.1.0"
edition = "2021"
description = "A self-hosted coding agent CLI: append-only event stream plus per-agent windows"
license = "MIT"

[lib]
name = "fs_agent"
path = "src/lib.rs"

[[bin]]
name = "fs-agent"
path = "src/main.rs"

[dependencies]
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
futures = "0.3"
# 只走 OpenAI 兼容的传输：不实现各家自己的协议，也不自己解析 SSE。
# `native-tls` 直接链系统的 OpenSSL，不去拉 aws-lc-rs 那套 C 构建。
reqwest = { version = "0.13", default-features = false, features = ["json", "stream", "native-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "net", "time", "process", "io-util"] }
# `bash` 工具的进程树清理：`Command::process_group(0)` 把 shell 放进它自己的进程组，
# 而只有 `killpg` 能终止整个组。
libc = "0.2"
# 交互式渲染器（spec §19）：ratatui 架在 crossterm 后端上，用行内视口（inline viewport，
# 不开备用屏幕，转录因此仍可滚动）。`event-stream` 给 crossterm 一个能进 `select!` 的
# 异步键盘源。
ratatui = "0.30"
crossterm = { version = "0.29", features = ["event-stream"] }
# 工具输出的语法高亮（spec §19）。Rust 文法本来就是依赖，所以这里复用那棵树；
# 整个闭包不引入 C 构建步骤（syntect 的 Oniguruma 那条路是刻意不走的）。
tree-sitter-highlight = "0.27"
toml = "0.8"
# 只做读侧的符号提取：把官方的 Rust `tags.scm` 过一遍 tree-sitter，得到
# `(file, name, kind)`。这个文法要编一个 C parser，所以首次构建比纯 Rust 依赖慢。
tree-sitter = "0.27"
tree-sitter-rust = "0.24"
url = "2"

[dev-dependencies]
tempfile = "3"
